<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fs Reaksiya Botlar</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:
        radial-gradient(circle at top left, #263b8f 0%, transparent 35%),
        radial-gradient(circle at bottom right, #6b21a8 0%, transparent 35%),
        #080b18;
    color: white;
    min-height: 100vh;
    padding: 20px 15px 35px;
    overflow-x: hidden;
}

.container { max-width: 600px; margin: auto; }

/* ===== HEADER ===== */
.header { text-align: center; padding: 25px 15px 20px; animation: fadeDown .7s ease; }

/* ===== LOGO (rasm bilan) ===== */
.logo {
    width: 85px;
    height: 85px;
    margin: auto;
    border-radius: 25px;
    overflow: hidden;
    background: linear-gradient(135deg, #667eea, #764ba2);
    box-shadow: 0 15px 40px rgba(102,126,234,.35), inset 0 1px 1px rgba(255,255,255,.25);
    animation: float 3s ease-in-out infinite, glow 2.5s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    padding: 2px;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 22px;
    display: block;
}

h1 { margin-top: 18px; font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
.subtitle { margin-top: 8px; color: #aeb7d6; font-size: 15px; line-height: 1.5; }

/* ===== USER ===== */
.welcome {
    margin: 5px 0 22px;
    padding: 15px 18px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(15px);
    border-radius: 18px;
    text-align: center;
    color: #dfe4ff;
    font-size: 14px;
}
#userName { font-weight: 700; color: #8ea2ff; }

/* ===== SECTION TITLE ===== */
.section-title {
    display: flex; align-items: center; gap: 9px;
    margin: 25px 3px 13px;
    font-size: 18px; font-weight: 750;
}

/* ===== BOTS GRID ===== */
.bots {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 11px;
}

.bot {
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    text-decoration: none;
    color: white;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.08);
    background: rgba(255,255,255,.075);
    backdrop-filter: blur(15px);
    transition: transform .25s ease, background .18s ease, box-shadow .25s ease;
    animation: fadeUp .5s cubic-bezier(.2,.8,.3,1) both;
    transform-style: preserve-3d;
    will-change: transform;
}

.bot:hover {
    background: rgba(255,255,255,.12);
    box-shadow:
        0 10px 30px rgba(0,0,0,.25),
        0 0 0 1px rgba(102,126,234,.3),
        0 0 40px rgba(102,126,234,.15);
}
.bot:active { transform: scale(.95); }

/* Shine effect */
.bot::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 70%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent);
    transform: skewX(-20deg);
    pointer-events: none;
}
.bot:active::after { left: 130%; transition: .5s; }

/* ===== AVATAR ===== */
.bot-avatar {
    position: relative;
    min-width: 48px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    padding: 2px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    box-shadow: 0 6px 18px rgba(102,126,234,.35);
    flex-shrink: 0;
    transform: translateZ(20px);
}

.bot-avatar img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    background: #1a1f3a;
    opacity: 0;
    transition: opacity .4s ease;
}
.bot-avatar img.loaded { opacity: 1; }

.bot-avatar .fallback {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 800;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
}

/* Online yashil nuqta */
.bot-avatar::after {
    content: "";
    position: absolute;
    bottom: 1px;
    right: 1px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #22c55e;
    border: 2px solid #0f1428;
    box-shadow: 0 0 8px rgba(34,197,94,.7);
    animation: pulse 2s ease-in-out infinite;
}

/* ===== BOT INFO ===== */
.bot-info {
    min-width: 0;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    transform: translateZ(20px);
}

.bot-name {
    font-size: 13px;
    font-weight: 750;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: .2px;
}

.bot-user {
    font-size: 11px;
    color: #8ea2ff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 600;
}

/* ===== BOT STATS ===== */
.bot-stats {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
    font-size: 10px;
    font-weight: 600;
    color: #8b95b8;
}

.stat { display: inline-flex; align-items: center; gap: 3px; }
.stat-icon { font-size: 10px; opacity: .85; }
.stat-value { letter-spacing: .2px; }

.stat-divider {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: currentColor;
    opacity: .4;
}

.stat.online .stat-value {
    color: #22c55e;
    font-weight: 700;
}

/* ===== ARROW ===== */
.arrow {
    color: #8894c7;
    font-size: 19px;
    flex-shrink: 0;
    transform: translateZ(20px);
    transition: transform .25s ease;
}
.bot:hover .arrow { transform: translateZ(20px) translateX(4px); }

/* ===== FOOTER ===== */
.footer {
    text-align: center;
    margin-top: 28px;
    color: #707a9e;
    font-size: 12px;
}

/* ===== RIPPLE ===== */
.ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,.45);
    transform: scale(0);
    animation: rippleAnim .6s ease-out;
    pointer-events: none;
    z-index: 2;
}

/* ===== ANIMATIONS ===== */
@keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px) scale(.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
}

@keyframes glow {
    0%,100% { box-shadow: 0 15px 40px rgba(102,126,234,.35), inset 0 1px 1px rgba(255,255,255,.25); }
    50% { box-shadow: 0 15px 55px rgba(118,75,162,.55), inset 0 1px 1px rgba(255,255,255,.25); }
}

@keyframes rippleAnim {
    to { transform: scale(4); opacity: 0; }
}

@keyframes pulse {
    0%,100% { box-shadow: 0 0 8px rgba(34,197,94,.7); }
    50% { box-shadow: 0 0 14px rgba(34,197,94,1); }
}

/* ===== REDUCED MOTION ===== */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
}

/* ===== MOBILE ===== */
@media (max-width: 380px) {
    .bots { grid-template-columns: 1fr; }
    h1 { font-size: 25px; }
}
</style>
</head>
<body>

<div class="container">

    <header class="header">
        <!-- ⚠️ Rasm URL manzilini o'zingiznikiga almashtiring -->
        <div class="logo">
            <img src="https://m6061.myxvest.ru/Reaksiya/Rasmlar/Logo.jpg"
                 alt="Fs Reaksiya Logo"
                 onerror="this.style.display='none'; this.parentElement.textContent='🤖';">
        </div>
        <h1>Fs Reaksiya Botlar</h1>
        <p class="subtitle">
            Kerakli reaksiya botini tanlang va Telegram orqali foydalanishni boshlang 🚀
        </p>
    </header>

    <div class="welcome">
        👋 Salom, <span id="userName">Foydalanuvchi</span>!
        <br>
        <span style="font-size:12px;color:#8f99b8;">
            Siz uchun barcha reaksiya botlari bir joyda
        </span>
    </div>

    <div class="section-title">
        🤖 <span>Reaksiya botlari</span>
    </div>

    <div class="bots" id="botsList"></div>

    <div class="footer">
        ⚡ Fs Reaksiya • Telegram Mini App
    </div>

</div>

<script>
/* ============================================================
   1. TELEGRAM MINI APP
   ============================================================ */
const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor("#080b18"); } catch(e) {}
    try { tg.setBackgroundColor("#080b18"); } catch(e) {}

    const user = tg.initDataUnsafe?.user;
    if (user) {
        const name = [user.first_name, user.last_name].filter(Boolean).join(" ") || "Foydalanuvchi";
        document.getElementById("userName").textContent = name;
    }
}

/* ============================================================
   2. SUPERSCRIPT RAQAMLAR
   ============================================================ */
const SUPERSCRIPTS = {
    "0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵",
    "6":"⁶","7":"⁷","8":"⁸","9":"⁹"
};

function toSuperscript(num) {
    return String(num).split("").map(d => SUPERSCRIPTS[d] || d).join("");
}

/* ============================================================
   3. BOT RASMLARI
   ============================================================ */
const BOT_IMAGES = {
    1:  "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm1.jpg",
    2:  "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm2.jpg",
    3:  "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm3.jpg",
    4:  "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm4.jpg",
    5:  "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm5.jpg",
    6:  "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm6.jpg",
    7:  "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm7.jpg",
    8:  "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm8.jpg",
    9:  "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm9.jpg",
    10: "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm10.jpg",
    11: "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm11.jpg",
    12: "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm12.jpg",
    13: "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm13.jpg",
    14: "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm14.jpg",
    15: "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm15.jpg",
    16: "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm16.jpg",
    17: "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm17.jpg",
    18: "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm18.jpg",
    19: "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm19.jpg",
    20: "https://m6061.myxvest.ru/Reaksiya/Rasmlar/Rasm20.jpg"
};

/* ============================================================
   4. STATISTIKA — FAKE GENERATOR
   ============================================================ */
function hashCode(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h) + str.charCodeAt(i);
        h |= 0;
    }
    return Math.abs(h);
}

function formatNumber(n) {
    if (n >= 1000000) return (n / 1000000).toFixed(1).replace(/\.0$/, "") + "M";
    if (n >= 1000) return (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
    return String(n);
}

function getFakeStats(username) {
    const seed = hashCode(username);
    const users = 500 + (seed % 45000);
    const uptime = 92 + (seed % 8);
    const online = (seed % 10) > 6;
    return {
        users: formatNumber(users),
        uptime: uptime + "%",
        online
    };
}

/* ============================================================
   5. LOCAL STATS (foydalanuvchi kliklari)
   ============================================================ */
const STATS_KEY = "fs_bot_stats";

function getLocalStats() {
    try {
        return JSON.parse(localStorage.getItem(STATS_KEY) || "{}");
    } catch { return {}; }
}

function incrementBotUsage(username) {
    const stats = getLocalStats();
    stats[username] = (stats[username] || 0) + 1;
    localStorage.setItem(STATS_KEY, JSON.stringify(stats));
}

/* ============================================================
   6. RIPPLE EFFECT
   ============================================================ */
function createRipple(e, el) {
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const x = (e.clientX || rect.left + rect.width / 2) - rect.left - size / 2;
    const y = (e.clientY || rect.top + rect.height / 2) - rect.top - size / 2;

    const ripple = document.createElement("span");
    ripple.className = "ripple";
    ripple.style.width = ripple.style.height = size + "px";
    ripple.style.left = x + "px";
    ripple.style.top = y + "px";

    el.appendChild(ripple);
    setTimeout(() => ripple.remove(), 600);
}

/* ============================================================
   7. 3D TILT (faqat desktop)
   ============================================================ */
function addTilt(el) {
    if (window.matchMedia("(hover: none)").matches) return;

    el.addEventListener("mousemove", (e) => {
        const rect = el.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        el.style.transform = `perspective(600px) rotateY(${x * 12}deg) rotateX(${-y * 12}deg) scale(1.03)`;
    });

    el.addEventListener("mouseleave", () => {
        el.style.transform = "";
    });
}

/* ============================================================
   8. BOTLARNI RENDER QILISH
   ============================================================ */
const TOTAL_BOTS = Object.keys(BOT_IMAGES).length;
const botsList = document.getElementById("botsList");

for (let i = 1; i <= TOTAL_BOTS; i++) {
    const sup = toSuperscript(i);
    const username = `Fs_Reaksiya_${i}Bot`;
    const imageUrl = BOT_IMAGES[i];
    const stats = getFakeStats(username);

    const el = document.createElement("a");
    el.className = "bot";
    el.href = `https://t.me/${username}`;
    el.style.animationDelay = Math.min(i * 0.035, 0.7) + "s";

    /* ----- Avatar ----- */
    const avatar = document.createElement("div");
    avatar.className = "bot-avatar";

    if (imageUrl) {
        const img = document.createElement("img");
        img.src = imageUrl;
        img.alt = username;
        img.loading = "lazy";
        img.onload = () => img.classList.add("loaded");
        img.onerror = () => {
            img.remove();
            const fb = document.createElement("div");
            fb.className = "fallback";
            fb.textContent = i;
            avatar.prepend(fb);
        };
        avatar.appendChild(img);
    } else {
        const fb = document.createElement("div");
        fb.className = "fallback";
        fb.textContent = i;
        avatar.appendChild(fb);
    }

    /* ----- Info + Stats ----- */
    const info = document.createElement("div");
    info.className = "bot-info";
    info.innerHTML = `
        <div class="bot-name">𝑹𝒆𝒂𝒌𝒔𝒊𝒚𝒂 𝑩𝒐𝒕 ${sup}</div>
        <div class="bot-user">@${username}</div>
        <div class="bot-stats">
            <span class="stat">
                <span class="stat-icon">👥</span>
                <span class="stat-value">${stats.users}</span>
            </span>
            <span class="stat-divider"></span>
            <span class="stat ${stats.online ? 'online' : ''}">
                <span class="stat-icon">${stats.online ? '🟢' : '⚡'}</span>
                <span class="stat-value">${stats.online ? 'Online' : stats.uptime}</span>
            </span>
        </div>
    `;

    /* ----- Arrow ----- */
    const arrow = document.createElement("div");
    arrow.className = "arrow";
    arrow.textContent = "›";

    el.append(avatar, info, arrow);

    /* ----- Events ----- */
    el.addEventListener("click", (e) => {
        createRipple(e, el);
        tg?.HapticFeedback?.impactOccurred("light");
        incrementBotUsage(username);
    });

    addTilt(el);

    botsList.appendChild(el);
}

/* ============================================================
   9. LIVE NUMBER ANIMATION (raqamlar 0 dan sanab chiqadi)
   ============================================================ */
function animateNumber(el, target) {
    const suffix = target.replace(/[\d.]/g, "");
    const num = parseFloat(target);
    if (isNaN(num)) return;

    const isDecimal = /[kM]$/.test(target);
    const duration = 900;
    const start = performance.now();

    function step(now) {
        const p = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - p, 3);
        const val = num * eased;
        el.textContent = (isDecimal ? val.toFixed(1) : Math.floor(val)) + suffix;
        if (p < 1) requestAnimationFrame(step);
        else el.textContent = target;
    }
    requestAnimationFrame(step);
}

// Renderdan keyin ishga tushirish
setTimeout(() => {
    document.querySelectorAll(".stat-value").forEach(el => {
        const t = el.textContent;
        if (/^\d/.test(t)) animateNumber(el, t);
    });
}, 500);
</script>

</body>
</html>
